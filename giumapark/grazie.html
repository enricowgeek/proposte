<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richiesta inviata — GiumaPark</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.png">
<style>
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:600 800;font-display:swap;src:url(font/baloo-2.woff2) format('woff2')}
:root{--arancio:#f7941e; --verde-scuro:#155e2b; --verde:#2f8f3e; --crema:#fffdf7; --inchiostro:#173a1c}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--arancio);
  color:var(--inchiostro); font-family:'Baloo 2',system-ui,sans-serif; font-weight:700; line-height:1.6;
  -webkit-font-smoothing:antialiased}
.foglio{max-width:480px; text-align:center; background:var(--crema); border:3px solid var(--verde-scuro);
  border-radius:24px; box-shadow:0 6px 0 var(--verde-scuro); padding:34px 26px}
img{width:96px; height:96px; border-radius:50%; margin:0 auto 16px; border:3px solid var(--verde-scuro)}
h1{margin:0 0 10px; font-size:1.7rem; font-weight:800; color:var(--verde-scuro)}
p{margin:0 0 20px}
a{display:inline-block; background:var(--verde); color:#fff; text-decoration:none; font-weight:800;
  padding:.72em 1.5em; border-radius:999px; box-shadow:0 4px 0 var(--verde-scuro)}
</style>
</head>
<body>
<main class="foglio">
  <img src="logo-giumapark.webp" width="96" height="96" alt="GiumaPark">
  <h1>Richiesta inviata</h1>
  <p>Grazie! Ti ricontattiamo il prima possibile.<br>Se hai fretta, scrivici su WhatsApp al 351 587 8573.</p>
  <a href="index.html">Torna al sito</a>
</main>
</body>
</html>
